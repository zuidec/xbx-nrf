# Windows configurator build: tools/configurator/build.sh in Git Bash. The
# .exe and its third-party notices are attached to the run as an artifact.
name: Configurator (Windows)

on:
  workflow_dispatch: # manual only: "Run workflow" (Actions tab) or gh workflow run

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash # Git Bash, as in docs/building.md
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11" # same as the Linux release container; tkinter included
      - name: Build
        run: tools/configurator/build.sh
        env:
          PYTHON: python # no python3 on Windows
      - name: Third-party notices
        run: tools/release-notices.sh tools/configurator/output configurator
      - uses: actions/upload-artifact@v4
        with:
          name: xbx-config-windows
          path: |
            tools/configurator/output/*.exe
            tools/configurator/output/THIRD-PARTY-NOTICES-configurator-windows.txt
          if-no-files-found: error
