# Radio: Enhanced ShockBurst
CONFIG_ESB=y
CONFIG_ESB_MAX_PAYLOAD_LENGTH=32
# per controller pipe (7): the ACK payload in flight + the next one queued,
# plus pairing answers
CONFIG_ESB_TX_FIFO_SIZE=24
CONFIG_CLOCK_CONTROL=y
CONFIG_ESB_CLOCK_INIT=y

CONFIG_GPIO=y

# Pairing: random address from the hardware RNG, stored with settings on NVS
CONFIG_ENTROPY_GENERATOR=y
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_NVS=y
CONFIG_SETTINGS=y
# factory reset restarts the dongle
CONFIG_REBOOT=y
# time slot frame clock (radio.c)
CONFIG_COUNTER=y

CONFIG_LOG=y

# USB: our own device (usb.c) instead of the board's CDC-ACM-at-boot device
CONFIG_USB_DEVICE_STACK_NEXT=y
CONFIG_CDC_ACM_SERIAL_INITIALIZE_AT_BOOT=n
CONFIG_HWINFO=y
# the console may be the CDC ACM port itself: its class can't log there
CONFIG_USBD_CDC_ACM_LOG_LEVEL_OFF=y
CONFIG_USBD_HID_SUPPORT=y
# the ~570-byte HID report descriptor (with PID) goes out in one control transfer
CONFIG_UDC_BUF_POOL_SIZE=2048
