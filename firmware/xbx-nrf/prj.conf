# Radio: Enhanced ShockBurst
CONFIG_ESB=y
CONFIG_ESB_MAX_PAYLOAD_LENGTH=32
CONFIG_CLOCK_CONTROL=y
CONFIG_ESB_CLOCK_INIT=y

CONFIG_GPIO=y
CONFIG_COUNTER=y

CONFIG_LOG=y

# Breadboard input: stick on the SAADC, rumble LEDs on PWM
CONFIG_ADC=y
CONFIG_PWM=y

# Calibration storage: settings on NVS in the storage partition
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_NVS=y
CONFIG_SETTINGS=y
# pairing factory reset restarts the controller
CONFIG_REBOOT=y

# USB (wired mode): our own device (usb.c) instead of the board's
# CDC-ACM-at-boot device
CONFIG_USB_DEVICE_STACK_NEXT=y
CONFIG_CDC_ACM_SERIAL_INITIALIZE_AT_BOOT=n
CONFIG_HWINFO=y
CONFIG_USBD_HID_SUPPORT=y
# the ~570-byte HID report descriptor (with PID) goes out in one control transfer
CONFIG_UDC_BUF_POOL_SIZE=2048
