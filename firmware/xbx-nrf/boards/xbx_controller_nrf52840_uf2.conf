# PCAL6416 buttons: raw I2C reads (pcal6416.c), not Zephyr's GPIO driver;
# asynchronous through RTIO (the TWIM's RTIO driver), waits sleep on semaphores
CONFIG_I2C=y
CONFIG_GPIO_PCAL64XXA=n
CONFIG_I2C_RTIO=y
CONFIG_RTIO_CONSUME_SEM=y
CONFIG_RTIO_SUBMIT_SEM=y

# power-off on USB power (power.c)
CONFIG_POWEROFF=y

# Stick Y reads higher downwards (stock pots; recheck on the TMR sticks)
CONFIG_XBX_LSTICK_INVERT_Y=y
CONFIG_XBX_RSTICK_INVERT_Y=y
