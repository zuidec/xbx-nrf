# Licensing per path (REUSE specification 3.x, https://reuse.software).
# Full license texts: LICENSES/. Summary: LICENSE.
version = 1

# Firmware, tools and repo config
[[annotations]]
path = ["firmware/**", "tools/**", ".gitignore", "REUSE.toml"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 zuidec"
SPDX-License-Identifier = "MIT"

# Hardware design
[[annotations]]
path = ["pcb/**", "references/pcb-cad*"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 zuidec"
SPDX-License-Identifier = "CERN-OHL-S-2.0"

# SnapMagic parts: symbols, footprints, 3D models (override the hardware rule)
[[annotations]]
path = [
  "pcb/xbx-nrf/lib/RKJXV122400R/**",
  "pcb/xbx-nrf-dongle/lib/USB_C_Receptacle_16P_Amphenol_10155435-00011LF/**",
  "pcb/xbx-nrf-dongle/lib/JS102011SAQN/**",
]
precedence = "override"
SPDX-FileCopyrightText = [
  "SnapMagic (SnapEDA) and the original authors",
  "2026 zuidec (modifications, see ATTRIBUTION.md in each folder)",
]
SPDX-License-Identifier = "CC-BY-SA-4.0"

# Documentation
[[annotations]]
path = ["docs/**", "*.md", "references/README.md"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 zuidec"
SPDX-License-Identifier = "CC-BY-4.0"
