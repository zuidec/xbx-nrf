# Licensing per path (REUSE specification 3.x, https://reuse.software).
# Full license texts: LICENSES/. Summary: LICENSE.
version = 1

# Firmware, tools, CI and repo config
[[annotations]]
path = ["firmware/**", "tools/**", ".github/**", ".gitignore", "REUSE.toml"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 zuidec"
SPDX-License-Identifier = "MPL-2.0"

# License texts of third-party code bundled in the Windows configurator build,
# kept as published (each file's first line names its source)
[[annotations]]
path = ["tools/configurator/licenses/**"]
precedence = "override"
SPDX-FileCopyrightText = "The authors named in each file"
SPDX-License-Identifier = "LicenseRef-Third-Party-Notices"

# Hardware design
[[annotations]]
path = ["pcb/**", "mech/**"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 zuidec"
SPDX-License-Identifier = "CERN-OHL-S-2.0"

# SnapMagic parts: symbols, footprints, 3D models (override the hardware rule)
[[annotations]]
path = [
  "pcb/xbx-nrf/lib/RKJXV122400R/**",
  "pcb/xbx-nrf-dongle/lib/USB_C_Receptacle_16P_Amphenol_10155435-00011LF/**",
  "pcb/xbx-nrf-dongle/lib/JS102011SAQN/**",
  "pcb/xbx-nrf-dongle/lib/xbx-nrf-lib.pretty/USB_C_Receptacle_16P_Amphenol_10155435-00011LF.kicad_mod",
  "pcb/xbx-nrf/lib/USB_C_Receptacle_16P_Amphenol_10155435-00011LF/**",
  "pcb/xbx-nrf/lib/xbx-nrf-lib.pretty/USB_C_Receptacle_16P_Amphenol_10155435-00011LF.kicad_mod",
]
precedence = "override"
SPDX-FileCopyrightText = [
  "SnapMagic (SnapEDA) and the original authors",
  "2026 zuidec (modifications, see ATTRIBUTION.md in each folder)",
]
SPDX-License-Identifier = "CC-BY-SA-4.0"

# Remix of Tryhard Customs' rear button guides (overrides the hardware rule;
# see mech/aux-button-guide/ATTRIBUTION.md)
[[annotations]]
path = ["mech/aux-button-guide/**"]
precedence = "override"
SPDX-FileCopyrightText = [
  "Tryhard Customs",
  "2026 zuidec (modifications, see ATTRIBUTION.md)",
]
SPDX-License-Identifier = "CC-BY-NC-SA-4.0"

# Footprints copied from KiCad's libraries into the project libraries
[[annotations]]
path = [
  "pcb/xbx-nrf/lib/xbx-nrf-lib.pretty/Raytac_MDBT50Q.kicad_mod",
  "pcb/xbx-nrf/lib/xbx-nrf-lib.pretty/Crystal_SMD_3215-2Pin_3.2x1.5mm.kicad_mod",
  "pcb/xbx-nrf/lib/xbx-nrf-lib.pretty/SolderJumper-3_P2.0mm_Open_TrianglePad1.0x1.5mm_NumberLabels.kicad_mod",
  "pcb/xbx-nrf/lib/xbx-nrf-lib.pretty/TestPoint_Pad_1.5x1.5mm-BigSilkscreen.kicad_mod",
  "pcb/xbx-nrf-dongle/lib/xbx-nrf-lib.pretty/Raytac_MDBT50Q.kicad_mod",
  "pcb/xbx-nrf-dongle/lib/xbx-nrf-lib.pretty/Crystal_SMD_3215-2Pin_3.2x1.5mm.kicad_mod",
  "pcb/xbx-nrf-dongle/lib/xbx-nrf-lib.pretty/SolderJumper-3_P2.0mm_Open_TrianglePad1.0x1.5mm_NumberLabels.kicad_mod",
  "pcb/xbx-nrf-dongle/lib/xbx-nrf-lib.pretty/TestPoint_Pad_*-NoSilkscreen.kicad_mod",
]
precedence = "override"
SPDX-FileCopyrightText = [
  "KiCad library contributors",
  "2026 zuidec (modifications, see ATTRIBUTION.md)",
]
SPDX-License-Identifier = "CC-BY-SA-4.0 WITH KiCad-libraries-exception"

# Controller symbol library: KiCad power symbols, a SnapMagic symbol and our
# own (see pcb/xbx-nrf/lib/ATTRIBUTION.md)
[[annotations]]
path = ["pcb/xbx-nrf/lib/xbx-nrf.kicad_sym", "pcb/xbx-nrf/lib/ATTRIBUTION.md"]
precedence = "override"
SPDX-FileCopyrightText = [
  "KiCad library contributors",
  "SnapMagic (SnapEDA) and the original authors",
  "2026 zuidec",
]
SPDX-License-Identifier = "CC-BY-SA-4.0 WITH KiCad-libraries-exception AND CC-BY-SA-4.0"

# Documentation
[[annotations]]
path = ["docs/**", "*.md", "references/README.md"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 zuidec"
SPDX-License-Identifier = "CC-BY-4.0"
